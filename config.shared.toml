[watch]
look_ahead_days = 7
minimum_notice_minutes = 0
state_path = "state/availability_state.json"

# Watch window: Monday–Thursday, 17:30–21:00.
# A slot must fit fully inside this window, so with allowed_durations = [90]
# the qualifying start times are 17:30, 18:00, 18:30, 19:00, 19:30 (19:30–21:00 is the last that fits).
[[watch_windows]]
days = ["mon", "tue", "wed", "thu"]
start = "17:30"
end = "21:00"

[[notification_windows]]
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "08:00"
end = "22:00"

[filters]
required_features = ["double"]
excluded_name_substrings = ["single"]
include_resource_names = []
exclude_resource_names = []
allowed_durations = [90]

[notifications]
# Telegram only; notify only when NEW free slots appear (no "nothing found" spam).
providers = ["telegram"]
notify_when_no_new_slots = false
# No [notifications.telegram] block here on purpose: the GitHub Actions workflow
# injects bot_token/chat_id from the TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
# repository secrets into config.runtime.toml at run time.
