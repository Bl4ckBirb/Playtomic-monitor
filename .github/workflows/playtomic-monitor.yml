name: Playtomic Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17,37,57 * * * *"

permissions:
  contents: write

concurrency:
  group: playtomic-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # TEMPORARY (branch claude/app-api-probe): this run executes the
      # api.app.playtomic.io reachability probe instead of the monitor, so it
      # can be triggered from the Actions UI (workflow_dispatch keys off the
      # default-branch copy of this file, then runs the selected branch's copy).
      # Do NOT merge this change to the default branch.
      - name: Probe app API
        env:
          # Optional. If set, sent as "Authorization: Bearer <token>".
          # Without it, a 401/JSON response still proves reachability.
          PLAYTOMIC_ACCESS_TOKEN: ${{ secrets.PLAYTOMIC_ACCESS_TOKEN }}
        run: python3 probe_playtomic_api.py
